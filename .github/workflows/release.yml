name: Сборка установщика

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'src-tauri/**'
      - 'build/**'
      - 'installer/**'
      - 'tools/**'
      - 'package.json'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать приложение (Rust, Tauri)
        run: cargo build --release --manifest-path src-tauri/Cargo.toml
      - name: NSIS
        shell: pwsh
        run: |
          $m = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $m)) { choco install nsis -y --no-progress | Out-Null }
          "MAKENSIS=$m" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Упаковать установщик
        run: node tools/package.mjs
      - name: Версия
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Chashi-windows-${{ steps.ver.outputs.v }}
          path: |
            dist/Chashi-Setup-*.exe
            dist/Chashi-Portable-*.exe
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Ночная чайная v${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/Chashi-Setup-${{ steps.ver.outputs.v }}.exe
            dist/Chashi-Portable-${{ steps.ver.outputs.v }}.exe
