name: Сборка установщика

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build/**'
      - 'main.js'
      - 'package.json'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Версия из package.json
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Собрать установщик и portable-версию
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Chashi-windows-${{ steps.ver.outputs.v }}
          path: dist/*.exe
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Ночная чайная v${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*.exe
