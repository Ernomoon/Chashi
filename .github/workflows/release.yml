name: Сборка установщика

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'build/**'
      - 'installer/**'
      - 'tools/**'
      - 'neutralino.config.json'
      - 'package.json'
      - 'RELEASE_NOTES.md'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Neutralino
        run: npx neu update
      - name: Собрать приложение и установщик
        run: node tools/build.mjs
      - name: Версия
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Chashi-windows-${{ steps.ver.outputs.v }}
          path: |
            dist/Chashi-Setup-*.exe
            dist/Chashi-Portable-*.exe
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Ночная чайная v${{ steps.ver.outputs.v }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/Chashi-Setup-${{ steps.ver.outputs.v }}.exe
            dist/Chashi-Portable-${{ steps.ver.outputs.v }}.exe
